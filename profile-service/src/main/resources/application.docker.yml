server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: profile-service
  datasource:
    url: jdbc:postgresql://postgres:5432/profile_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  config:
    import: optional:configserver:http://config-server:8888
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 20
        initial-interval: 1500
        multiplier: 1.5
        max-interval: 10000

jwt:
  secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8b78d86cc2dce1637bd}
  expiration: 86400000 # 24 hours in milliseconds

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized 