server:
  port: 8083
  servlet:
    context-path: /api/v1

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/dtbonthego
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      client-id: payment-service
      transaction-topic: payment-transactions
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.dtbonthego.paymentservice.model.dto,com.dtbonthego.eventsservice.model.dto

jwt:
  secret: ${JWT_SECRET:M2NmYTc2ZWYxNDkzN2MxYzBlYTUxOWY4ZmMwNTdhODBmY2QwNGE3NDIwZjhlOGI3OGQ4NmNjMmRjZTE2MzdiZA==}
  expiration: 86400000 # 24 hours in milliseconds
  
# Store of Value Service Configuration
store-of-value-service:
  url: ${STORE_OF_VALUE_URL:http://localhost:8082/api/v1}

profile-service:
  url: ${PROFILE_SERVICE_URL:http://localhost:8081/api/v1}
      
# Logging configuration
logging:
  level:
    root: INFO
    com.dtbonthego: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: INFO
    org.springdoc: DEBUG
    
# OpenAPI configuration
management:
  server:
    port: 9093
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always 
      